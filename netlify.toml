[build]
  command = "npm install && npm run build"
  publish = "dist"

# Redirect all non-file requests to index.html for client-side routing
# This prevents redirecting static assets while supporting SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  # This ensures existing files are served first before redirecting
